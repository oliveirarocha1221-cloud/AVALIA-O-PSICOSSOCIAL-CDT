<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargos da Empresa</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:linear-gradient(135deg,#0c4a6e,#2563eb);min-height:100vh;}
.header{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);padding:20px 40px;display:flex;align-items:center;color:white;}
.logo{display:flex;align-items:center;gap:10px;}
.logo img{width:45px;height:45px;border-radius:50%;}
.container{max-width:1000px;margin:40px auto;background:white;padding:30px;border-radius:16px;box-shadow:0 15px 40px rgba(0,0,0,0.2);}
.topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
h1{color:#0c4a6e;font-size:22px;}
.card{background:#f8fafc;padding:20px;margin-top:15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;border:1px solid #e2e8f0;}
.nome{font-size:18px;font-weight:600;}
.qtd{font-size:14px;color:#64748b;}
button{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:white;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;}
.voltar{text-align:center;margin-top:30px;}
.footer{text-align:center;color:white;margin-top:20px;font-size:14px;}
</style>
</head>

<body>

<div class="header">
  <div class="logo">
    <img src="https://cdn-icons-png.flaticon.com/512/2920/2920329.png">
    <span>Clínica Do Trabalho</span>
  </div>
</div>

<div class="container">

<div class="topo">
  <h1 id="tituloEmpresa"></h1>
  <button onclick="gerarPDF()">📄 Gerar Relatório</button>
</div>

<div id="listaCargos"></div>

<div class="voltar">
  <button onclick="voltar()">⬅ Voltar</button>
</div>

</div>

<div class="footer">
© 2026 Clínica Do Trabalho
</div>

<script>

function normalizar(txt){
  return txt.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

let params = new URLSearchParams(window.location.search);
let chave = params.get("empresa");

let dados = JSON.parse(localStorage.getItem("respostas")) || {};
let empresa = dados[chave];

let titulo = document.getElementById("tituloEmpresa");
let lista = document.getElementById("listaCargos");

let cargos = {};

if(!empresa){
  titulo.innerText = "Empresa não encontrada";
}else{

  titulo.innerText = "Cargos - " + empresa.nome;

  empresa.respostas.forEach(r=>{
    let cargo = r.cargo || "Não informado";
    if(!cargos[cargo]) cargos[cargo]=[];
    cargos[cargo].push(r);
  });

  for(let cargo in cargos){
    let card = document.createElement("div");
    card.className="card";

    card.innerHTML = `
      <div>
        <div class="nome">${cargo}</div>
        <div class="qtd">${cargos[cargo].length} respostas</div>
      </div>
      <button onclick="abrirCargo('${cargo}')">Ver Relatório</button>
    `;

    lista.appendChild(card);
  }
}

function abrirCargo(cargo){
  window.location.href="painel.html?empresa="+encodeURIComponent(chave)+"&cargo="+encodeURIComponent(cargo);
}

function voltar(){
  window.location.href="empresas.html";
}

function gerarPDF(){

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 20;
  const pageHeight = 280;

  function novaLinha(espaco = 8){
    y += espaco;
    if(y > pageHeight){
      doc.addPage();
      y = 20;
    }
  }

  function titulo(txt){
    doc.setFontSize(16);
    doc.setFont(undefined, "bold");
    doc.text(txt, 20, y);
    novaLinha(12);
    doc.setFont(undefined, "normal");
  }

  function subtitulo(txt){
    doc.setFontSize(13);
    doc.setFont(undefined, "bold");
    doc.text(txt, 20, y);
    novaLinha(10);
    doc.setFont(undefined, "normal");
  }

  function texto(txt){
    doc.setFontSize(11);
    const linhas = doc.splitTextToSize(txt, 170);
    doc.text(linhas, 20, y);
    novaLinha(linhas.length * 5);
  }

  function linha(){
    doc.line(20, y, 190, y);
    novaLinha(6);
  }

  function normalizar(txt){
    return txt
      .toLowerCase()
      .trim()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  // 🔥 MESMA LÓGICA DO GRÁFICO
  const classificacao = {
    "frequentemente, sinto que tenho muito trabalho para fazer.": {
      "sempre": "ruim", "as vezes": "medio", "raramente": "bom"
    },
    "tenho prazos razoaveis para cumprir minhas tarefas.": {
      "sempre": "bom", "as vezes": "medio", "raramente": "ruim"
    },
    "tenho liberdade para decidir como realizar minhas tarefas.": {
      "sempre": "bom", "as vezes": "medio", "raramente": "ruim"
    },
    "sinto que ha pressao psicologica nas atividades que realizo.": {
      "sempre": "ruim", "as vezes": "medio", "raramente": "bom"
    },
    "meu trabalho interfere negativamente na minha vida familiar.": {
      "sempre": "ruim", "as vezes": "medio", "raramente": "bom"
    }
  };

  let data = new Date().toLocaleDateString();

  titulo("RELATÓRIO PSICOSSOCIAL");

  texto(`Empresa: ${empresa.nome}`);
  texto(`Total de colaboradores: ${empresa.respostas.length}`);
  texto(`Data: ${data}`);

  linha();

  let ranking = [];
  let pontuacaoEmpresa = 0;
  let totalPerguntasEmpresa = 0;

  for(let cargo in cargos){

    let respostasCargo = cargos[cargo];
    let contagem = {};

    // AGRUPA IGUAL AO GRÁFICO
    respostasCargo.forEach(r => {
      for(let pergunta in r){

        if(pergunta === "empresa" || pergunta === "cargo") continue;

        let perguntaNorm = normalizar(pergunta);
        let valorNorm = normalizar(r[pergunta]);

        if(!contagem[perguntaNorm]){
          contagem[perguntaNorm] = {};
        }

        if(!contagem[perguntaNorm][valorNorm]){
          contagem[perguntaNorm][valorNorm] = 0;
        }

        contagem[perguntaNorm][valorNorm]++;
      }
    });

    let pontuacao = 0;
    let totalPerguntas = 0;

    // CALCULA IGUAL AO GRÁFICO
    for(let pergunta in contagem){

      totalPerguntas++;

      let respostasObj = contagem[pergunta];

      let respostaPrincipal = Object.keys(respostasObj)
        .reduce((a,b)=> respostasObj[a] > respostasObj[b] ? a : b);

      let tipo = classificacao[pergunta]?.[respostaPrincipal];

      if(tipo === "ruim") pontuacao += 2;
      else if(tipo === "medio") pontuacao += 1;

      // empresa também segue igual
      pontuacaoEmpresa += (tipo === "ruim" ? 2 : tipo === "medio" ? 1 : 0);
      totalPerguntasEmpresa++;
    }

    let media = pontuacao / totalPerguntas;

    let nivel = "Baixo";
    if(media >= 1.3) nivel = "Alto";
    else if(media >= 0.6) nivel = "Médio";

    ranking.push({
      cargo,
      nivel,
      media,
      total: respostasCargo.length
    });
  }

  let mediaEmpresa = pontuacaoEmpresa / totalPerguntasEmpresa;

  let nivelEmpresa = "Baixo";
  if(mediaEmpresa >= 1.3) nivelEmpresa = "Alto";
  else if(mediaEmpresa >= 0.6) nivelEmpresa = "Médio";

  // RESUMO
  subtitulo("Resumo Executivo");

  texto(`O nível geral de risco foi classificado como ${nivelEmpresa}, com índice ${mediaEmpresa.toFixed(2)}.`);

  linha();

  // CARGOS
  subtitulo("Análise por Cargo");

  ranking.forEach(r => {

    doc.setFont(undefined, "bold");
    doc.text(`Cargo: ${r.cargo}`, 20, y);
    novaLinha();
    doc.setFont(undefined, "normal");

    texto(`Colaboradores: ${r.total}`);
    texto(`Risco: ${r.nivel}`);
    texto(`Índice: ${r.media.toFixed(2)}`);

    let interpretacao =
      r.nivel === "Alto"
      ? "Risco elevado. Recomenda-se intervenção imediata."
      : r.nivel === "Médio"
      ? "Risco moderado. Necessário acompanhamento."
      : "Baixo risco. Ambiente considerado estável.";

    texto(interpretacao);

    linha();
  });

  // RANKING
  ranking.sort((a,b)=> b.media - a.media);

  subtitulo("Ranking de Risco");

  ranking.forEach(r => {
    texto(`${r.cargo} — ${r.nivel} (${r.media.toFixed(2)})`);
  });

  // CONCLUSÃO INTELIGENTE
  subtitulo("Conclusão Técnica");

  if(nivelEmpresa === "Alto"){
    texto("A empresa apresenta alto risco psicossocial, sendo recomendada a adoção imediata de medidas corretivas e acompanhamento especializado.");
  }else if(nivelEmpresa === "Médio"){
    texto("A empresa apresenta risco moderado, sendo recomendável monitoramento contínuo e ações preventivas.");
  }else{
    texto("A empresa apresenta baixo risco psicossocial, não sendo necessária intervenção imediata, apenas manutenção das boas práticas.");
  }

  novaLinha(10);
  doc.setFontSize(9);
  doc.text("Relatório gerado automaticamente - Clínica do Trabalho", 20, y);

  doc.save("relatorio_final.pdf");
}

</script>

</body>
</html>
